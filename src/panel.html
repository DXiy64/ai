<div id="chart3d"></div>
<div id="chart2d" hidden></div>
<div id="axis-caption" class="axis-caption"></div>
<aside class="panel">
  <h1>AI 模型对比</h1>
  <p class="sub" id="selection-summary"></p>
  <nav aria-label="选择视图">
    <button data-view="free" aria-pressed="true">自由视图<span>3D</span></button
    ><button data-view="front" aria-pressed="false">
      正视图<span>能力 × 时间</span></button
    ><button data-view="side" aria-pressed="false">
      侧视图<span>成本 × 时间</span></button
    ><button data-view="top" aria-pressed="false">
      俯视图<span>能力 × 成本</span>
    </button>
  </nav>
  <div class="notes">
    能力越高越好；成本和时间越低越好。<br />同色代表同一模型，连线表示不同思维档位。<br />时间不含首
    token 等开销。
  </div>
  <details id="picker" open>
    <summary>选择显示的模型</summary>
    <div class="picker-body">
      <input
        id="search"
        type="search"
        placeholder="搜索模型或厂商…"
        aria-label="搜索模型或厂商"
      />
      <div class="actions">
        <button id="select-all">全选</button><button id="clear-all">清空</button
        ><span id="count"></span>
      </div>
      <div id="model-list" class="model-list"></div>
    </div>
  </details>
</aside>
<div id="status" role="status">自由视图</div>
<p id="hint"></p>
<div id="empty" hidden>尚未选择模型<small>在左侧勾选模型，开始对比</small></div>
